[env]
MISE_NODE_COREPACK = 1
LEFTHOOK = 0
LD_LIBRARY_PATH = "/home/linuxbrew/.linuxbrew/lib:${LD_LIBRARY_PATH:-}"

[tools]
bun = "latest"
deno = "latest"
go = "1.26.1"
hk = "latest"
node = "24"
pkl = "latest"
python = "3.14.2"

"aqua:FiloSottile/age" = "latest"
"github:jandedobbeleer/aliae" = "latest"
"github:str4d/age-plugin-yubikey" = "latest"
"github:atuinsh/atuin" = "latest"
"github:tylerbutler/repoverlay" = "0.18.1"
"cargo:cargo-audit" = "latest"
"cargo:cargo-deny" = "latest"
actionlint = "latest"
"cargo:cargo-llvm-cov" = "latest"
dagger = "latest"
ruff = "latest"
cargo-binstall = "latest"
"github:sethvargo/ratchet" = "latest"
"go:github.com/kunchenguid/treehouse" = "latest"
herdr = "latest"
pnpm = "latest"
java = "17"
sd = "latest"
dotnet = "10.0.302"
k6 = "2.2.0"

[settings]
# config files with these prefixes will be trusted by default
trusted_config_paths = [
    '~/code/',
]

jobs = 8            # number of plugins or runtimes to install in parallel. The default is `4`.
idiomatic_version_file_enable_tools = ["erlang", "elixir"] # enable idiomatic version file support for these tools (e.g. rebar.config for erlang, mix.exs for elixir)
env_shell_expand = false

[settings.status]
show_env = true
show_tools = true

[settings.python]
compile = false
